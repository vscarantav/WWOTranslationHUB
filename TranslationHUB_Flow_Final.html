<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TranslationHUB — Process Flow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
    <style>
        :root {
            --human: #ff6b81;
            --human-bg: rgba(255, 107, 129, 0.15);
            --auto: #26de81;
            --auto-bg: rgba(38, 222, 129, 0.12);
            --bot: #ffd32a;
            --bot-bg: rgba(255, 211, 42, 0.12);
            --conditional: #45aaf2;
            --conditional-bg: rgba(69, 170, 242, 0.12);
            --glass: rgba(255,255,255,0.06);
            --glass-border: rgba(255,255,255,0.12);
            --text: #e8ecf0;
            --text-muted: rgba(232,236,240,0.55);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: #0d1117;
            background-image:
                radial-gradient(ellipse 80% 60% at 20% -10%, rgba(102,51,238,0.28) 0%, transparent 60%),
                radial-gradient(ellipse 60% 50% at 80% 110%, rgba(29,185,255,0.18) 0%, transparent 55%),
                radial-gradient(ellipse 50% 40% at 50% 50%, rgba(20,20,40,0.6) 0%, transparent 100%);
            color: var(--text);
            padding: 32px 24px 48px;
            overflow-x: hidden;
        }

        /* ── HEADER ── */
        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 36px;
        }
        .badge {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: rgba(138,101,255,0.9);
            background: rgba(138,101,255,0.12);
            border: 1px solid rgba(138,101,255,0.25);
            padding: 4px 14px;
            border-radius: 20px;
        }
        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(26px, 4vw, 42px);
            font-weight: 700;
            background: linear-gradient(135deg, #e8ecf0 0%, rgba(138,101,255,0.9) 60%, #45aaf2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
            line-height: 1.15;
        }
        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            text-align: center;
        }

        /* ── LEGEND ── */
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 24px;
        }
        .legend-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 16px;
            border-radius: 40px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            background: var(--glass);
            font-size: 13px;
            font-weight: 500;
            transition: transform 0.2s, background 0.2s;
            cursor: default;
        }
        .legend-pill:hover { transform: translateY(-2px); background: rgba(255,255,255,0.1); }
        .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
        .dot-human  { background: var(--human); box-shadow: 0 0 8px var(--human); }
        .dot-auto   { background: var(--auto);  box-shadow: 0 0 8px var(--auto); }
        .dot-bot    { background: var(--bot);   box-shadow: 0 0 8px var(--bot); }
        .dot-cond   { background: var(--conditional); box-shadow: 0 0 8px var(--conditional); }

        /* ── TOOLBAR ── */
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            margin-bottom: 12px;
        }
        .toolbar-btn {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 500;
            padding: 7px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .toolbar-btn:hover { background: rgba(255,255,255,0.12); transform: translateY(-1px); }
        .toolbar-label { font-size: 12px; color: var(--text-muted); margin-right: 4px; }

        /* ── DIAGRAM CARD ── */
        .diagram-card {
            width: 100%;
            height: 72vh;
            min-height: 480px;
            border-radius: 18px;
            overflow: hidden;
            position: relative;
            background: rgba(13,17,23,0.6);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.04) inset,
                0 40px 80px rgba(0,0,0,0.5),
                0 0 120px rgba(138,101,255,0.08);
        }
        .diagram-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: linear-gradient(135deg, rgba(255,255,255,0.04) 0%, transparent 50%);
            pointer-events: none;
            z-index: 1;
        }
        #graphDiv {
            width: 100%;
            height: 100%;
        }

        /* ── SELECTION TOAST ── */
        #selection-toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: rgba(30,30,50,0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: white;
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            border: 1px solid rgba(138,101,255,0.4);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.04) inset;
            opacity: 0;
            transition: opacity 0.25s, transform 0.25s;
            pointer-events: none;
            z-index: 1000;
            white-space: nowrap;
            max-width: 90vw;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .show-toast {
            opacity: 1 !important;
            transform: translateX(-50%) translateY(0) !important;
        }

        /* ── ERROR LOG ── */
        #error-log {
            color: var(--human);
            background: rgba(255, 107, 129, 0.1);
            border: 1px solid rgba(255,107,129,0.3);
            padding: 14px;
            display: none;
            font-family: monospace;
            white-space: pre-wrap;
            margin-bottom: 20px;
            border-radius: 10px;
            font-size: 13px;
        }

        /* ── MERMAID OVERRIDES ── */
        /* Make the mermaid SVG fill the dark card */
        #graphDiv svg {
            background: transparent !important;
        }
        /* Node text */
        #graphDiv .nodeLabel, #graphDiv .node text, #graphDiv text {
            font-family: 'Inter', sans-serif !important;
            font-size: 20px;
        }
        /* Subgraph label */
        #graphDiv .subgraphLabel text, #graphDiv .label text {
            font-family: 'Inter', sans-serif !important;
            font-weight: 600;
        }

        /* Selected node highlight */
        .selected-node rect, .selected-node circle, .selected-node polygon {
            stroke: #a78bfa !important;
            stroke-width: 3px !important;
        }
        .selected-node {
            filter: drop-shadow(0px 0px 10px rgba(167, 139, 250, 0.7));
        }

        /* ── FOOTER ── */
        footer {
            text-align: center;
            margin-top: 28px;
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body>

    <header>
        <span class="badge">Internal Architecture</span>
        <h1>TranslationHUB Process Flow</h1>
        
    </header>

    <div class="legend">
        <div class="legend-pill"><span class="legend-dot dot-human"></span> Human Intervention</div>
        <div class="legend-pill"><span class="legend-dot dot-auto"></span> Fully Automated</div>
        <div class="legend-pill"><span class="legend-dot dot-bot"></span> AI / Bot Processing</div>
        <div class="legend-pill"><span class="legend-dot dot-cond"></span> Conditional Step</div>
    </div>

    <div class="toolbar">
        <button class="toolbar-btn" id="btn-fit">Fit</button>
        <button class="toolbar-btn" id="btn-zoom-in">+ Zoom In</button>
        <button class="toolbar-btn" id="btn-zoom-out">− Zoom Out</button>
    </div>

    <div id="error-log"></div>

    <div class="diagram-card">
        <div id="graphDiv"></div>
    </div>

    <div id="selection-toast"></div>

    <footer>WWO TranslationHUB</footer>

    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';

        mermaid.initialize({
            startOnLoad: false,
            theme: 'dark',
            themeVariables: {
                darkMode: true,
                background: '#0d1117',
                primaryColor: '#1e1e3a',
                primaryTextColor: '#e8ecf0',
                primaryBorderColor: '#3a3a5c',
                lineColor: '#6b7280',
                secondaryColor: '#1a1a2e',
                tertiaryColor: '#12121f',
                edgeLabelBackground: '#1e1e3a',
                clusterBkg: 'rgba(30,30,60,0.5)',
                clusterBorder: '#3a3a5c',
                fontFamily: 'Inter, sans-serif',
                fontSize: '20px',
                nodeBorder: '#3a3a5c',
                mainBkg: '#1e1e3a',
            }
        });

        const graphText = `flowchart LR
    classDef human fill:#3d1a20,stroke:#ff6b81,stroke-width:2px,color:#ffd6dc
    classDef auto fill:#0f2d1e,stroke:#26de81,stroke-width:2px,color:#b8f5d8
    classDef bot fill:#2d2700,stroke:#ffd32a,stroke-width:2px,color:#fff4b8
    classDef conditional fill:#0e1f36,stroke:#45aaf2,stroke-width:2px,stroke-dasharray:5 5,color:#b8dcf8

    StartNode((Start Hub))

    subgraph Path0 ["0. HUB Updates"]
        direction LR
        Input0["Human: Check for Updates"]
        subgraph Auto0 ["FAST-FORWARD AND RESTART"]
            direction LR
            CheckRemote["Verify Remote and Username"]
            GitFetch["Git Fetch origin main"]
            GitMerge["Fast-Forward Merge"]
            RestartApp["Restart Translation HUB"]
            CheckRemote --> GitFetch --> GitMerge --> RestartApp
        end
        Input0 --> CheckRemote
    end

    subgraph Path1 ["1. Canvas IMSCC Translation"]
        direction LR
        Input1["Human: Select IMSCC and Lang"]
        CsePrompt{"CSE Course?"}
        CseGlossSelect["Human: Select Optional CSE Glossary"]

        subgraph Auto1 ["AUTOMATED IMSCC PIPELINE"]
            direction LR
            Extract1["WorkspaceManager: Extract and Parse context.xml"]
            GroupCheck1["Collect Group Configs (Canvas API)"]
            LinkP_Pre1["LinkProcessor: Pre-process links and link_mapping.json"]
            SpecialPages1["Apply W07 Evaluation and Attention Messaging Templates"]

            subgraph FileLoop1 ["Parallel File Translation Loop (ThreadPool max_workers=3)"]
                direction TB
                AuditGL1["GlossaryAuditBot: Extract Terms"]
                AuditSC1["ScriptureCheckBot: Extract Scriptures"]

                subgraph AITranslators1 ["Specialized Bots (Gemini 3.5 Flash)"]
                    direction TB
                    HTMLBot1["HTMLTranslationAgent (Full and Chunked)"]
                    XMLBot1["XMLTranslationAgent (XML and QTI, max 600 lines)"]
                    TXTBot1["TextTranslationAgent"]
                    OfficeBot1["DOCX and XLSX TranslationBots"]
                end

                CSEPostPass1["CSEGlossaryAgent: Terms Post-Pass"]

                AuditGL1 --> AuditSC1
                AuditSC1 --> HTMLBot1 & XMLBot1 & TXTBot1 & OfficeBot1
                HTMLBot1 & XMLBot1 & TXTBot1 & OfficeBot1 --> CSEPostPass1
            end

            Repack1["WorkspaceManager: Repackage .imscc"]
            Dash1["DashboardGenerator: Multi-tab Excel Report"]

            Extract1 --> GroupCheck1 --> LinkP_Pre1 --> SpecialPages1 --> FileLoop1
            FileLoop1 --> Repack1 --> Dash1
        end

        ManualImport1["Human: Import to Canvas"]
        GroupDecision1{"Has Groups?"}
        AutoMigrate1["Canvas Group Migration (Canvas API)"]
        Checklist1["Human: Review Post-Translation Checklist"]

        Input1 --> CsePrompt
        CsePrompt -- Yes --> CseGlossSelect --> Extract1
        CsePrompt -- No --> Extract1
        Dash1 --> ManualImport1
        ManualImport1 --> GroupDecision1
        GroupDecision1 -- Yes --> AutoMigrate1 --> Checklist1
        GroupDecision1 -- No --> Checklist1
    end

    subgraph Path2 ["2. EdTech Master Translator"]
        direction LR
        Input2["Human: Select Lang and Enter Shell URL"]
        CheckpointCheck2{"Resume Checkpoint?"}

        subgraph Auto2 ["AUTOMATED SCRAPING AND INJECTION (Playwright)"]
            direction LR
            Scrape2["EdTechScraperBot: Extract CodeMirror Chapters"]
            Piggyback2["Prepend Hidden Metadata (Title and Subtitle)"]
            LinkP2["LinkProcessor: Shared link_mapping.json"]

            subgraph EdTechLoop2 ["HTML Chunk Translation (Gemini 3.5 Flash)"]
                direction TB
                ETChunkBot["HTMLTranslationAgent (Chunked Mode, max 6000 chars)"]
                ETVerifyEN["Unchanged English Detection and Retries"]
                ETChunkBot --> ETVerifyEN
            end

            ETReport2["EdTech Translation Report"]
            Inject2["EdTechScraperBot: Inject CodeMirror Chapters and Save"]
            Verify2["Reopen Editor and Verify Persisted Content"]

            Scrape2 --> Piggyback2 --> LinkP2 --> EdTechLoop2 --> ETReport2 --> Inject2 --> Verify2
        end

        Checklist2["Human: Review EdTech Checklist"]
        Input2 --> CheckpointCheck2
        CheckpointCheck2 -- New Run --> Scrape2
        CheckpointCheck2 -- Resume --> Inject2
        Verify2 --> Checklist2
    end

    subgraph Path3 ["3. Quality Assurance Audit"]
        direction LR
        Input3["Human: Select EN and Translated IMSCCs"]

        subgraph Auto3 ["AUTOMATED QA AUDIT"]
            direction LR
            Extract3["CourseAuditor: Extract and Index Manifests"]

            subgraph QAPairing3 ["Multi-Step File Matching"]
                direction TB
                PairManifest["Match by Resource ID"]
                PairPath["Match by Relative Path"]
                PairAI["QAAuditBot: AI File Pairing (e.g. W03 to S03)"]
                PairManifest --> PairPath --> PairAI
            end

            subgraph QALoop3 ["Auditing Engines"]
                direction TB
                LinksAudit3["Strict Link Audit: URL Comparison"]
                ContentAudit3["QAAuditBot: LLM Semantic and Content Audit"]
            end

            subgraph QAReport3 ["Excel QA Report"]
                direction TB
                Sheet1["Page Audit Report"]
                Sheet2["Content Audit Report"]
                Sheet3["Links Audit Report"]
            end

            Extract3 --> QAPairing3 --> QALoop3
            QALoop3 --> Sheet1 & Sheet2 & Sheet3
        end

        End3(((Audit Complete)))
        Input3 --> Extract3
        Sheet1 & Sheet2 & Sheet3 --> End3
    end

    subgraph Path4 ["4. GitHub Textbook Translation"]
        direction LR
        Input4["Human: Enter Repo URL, Branch and Glossary"]

        subgraph Auto4 ["AUTOMATED GITHUB PIPELINE"]
            direction LR
            Clone4["Clone Source Read-Only (disabled-source-push)"]
            MergeGloss4["Merge 3-Tier Glossaries (General, SD, Course)"]

            subgraph VarAnalysis4 ["Variable Analysis (Gemini 3.5 Flash)"]
                direction TB
                SeedProtected4["Seed Protected Platform Identifiers (NODE_ENV, _id, process.env)"]
                GeminiVars4["Generate Portuguese Identifiers (Matching Convention)"]
                ValidateVars4["Deterministic Repo-Wide Collision and Delta Validation"]
                SeedProtected4 --> GeminiVars4 --> ValidateVars4
            end

            subgraph ProseTrans4 ["Prose Translation and Variable Replacement"]
                direction TB
                ProseBot4["MarkdownTranslationBot and HTMLTranslationAgent"]
                ApplyVars4["Apply Approved Variable Renames to Code and Linked IDs"]
                ProseBot4 --> ApplyVars4
            end

            SyntaxCheck4["Baseline-Aware Code Syntax Validation (Python Dedent)"]
            GHReport4["GitHubTranslationReportGenerator (Reviewing, Variables, Resources)"]
            Publish4["Create Personal Public Repo and Publish GitHub Pages"]

            Clone4 --> MergeGloss4 --> VarAnalysis4 --> ProseTrans4 --> SyntaxCheck4 --> GHReport4 --> Publish4
        end

        End4(((Publication Complete)))
        Input4 --> Clone4
        Publish4 --> End4
    end

    StartNode --> Input0
    StartNode --> Input1
    StartNode --> Input2
    StartNode --> Input3
    StartNode --> Input4

    class StartNode human
    class Input0 human
    class Input1 human
    class CseGlossSelect human
    class ManualImport1 human
    class Checklist1 human
    class Input2 human
    class Checklist2 human
    class Input3 human
    class Input4 human

    class CheckRemote auto
    class GitFetch auto
    class GitMerge auto
    class RestartApp auto
    class Extract1 auto
    class GroupCheck1 auto
    class LinkP_Pre1 auto
    class SpecialPages1 auto
    class Repack1 auto
    class Dash1 auto
    class AutoMigrate1 auto
    class Scrape2 auto
    class Piggyback2 auto
    class LinkP2 auto
    class ETReport2 auto
    class Inject2 auto
    class Verify2 auto
    class Extract3 auto
    class PairManifest auto
    class PairPath auto
    class LinksAudit3 auto
    class Sheet1 auto
    class Sheet2 auto
    class Sheet3 auto
    class End3 auto
    class Clone4 auto
    class MergeGloss4 auto
    class SyntaxCheck4 auto
    class GHReport4 auto
    class Publish4 auto
    class End4 auto

    class CsePrompt conditional
    class GroupDecision1 conditional
    class CheckpointCheck2 conditional

    class AuditGL1 bot
    class AuditSC1 bot
    class HTMLBot1 bot
    class XMLBot1 bot
    class TXTBot1 bot
    class OfficeBot1 bot
    class CSEPostPass1 bot
    class ETChunkBot bot
    class ETVerifyEN bot
    class PairAI bot
    class ContentAudit3 bot
    class SeedProtected4 bot
    class GeminiVars4 bot
    class ValidateVars4 bot
    class ProseBot4 bot
    class ApplyVars4 bot`;

        let panZoomInstance = null;
        let toastTimeout;

        async function drawDiagram() {
            try {
                const { svg } = await mermaid.render('mermaid-svg', graphText);
                document.getElementById('graphDiv').innerHTML = svg;

                const svgEl = document.querySelector('#graphDiv svg');
                svgEl.style.width = '100%';
                svgEl.style.height = '100%';
                svgEl.style.maxWidth = 'none';
                svgEl.style.background = 'transparent';

                panZoomInstance = svgPanZoom(svgEl, {
                    controlIconsEnabled: false,
                    zoomEnabled: true,
                    panEnabled: true,
                    dblClickZoomEnabled: true,
                    mouseWheelZoomEnabled: true,
                    preventMouseEventsDefault: false,
                    zoomScaleSensitivity: 0.2,
                    minZoom: 0.08,
                    maxZoom: 12,
                    fit: true,
                    center: true
                });

                // Toolbar controls
                document.getElementById('btn-fit').addEventListener('click', () => {
                    panZoomInstance.fit();
                    panZoomInstance.center();
                });
                document.getElementById('btn-zoom-in').addEventListener('click', () => panZoomInstance.zoomIn());
                document.getElementById('btn-zoom-out').addEventListener('click', () => panZoomInstance.zoomOut());

                // Node selection
                const nodes = document.querySelectorAll('.node');
                const toast = document.getElementById('selection-toast');

                nodes.forEach(node => {
                    node.style.cursor = 'pointer';
                    node.addEventListener('click', (e) => {
                        nodes.forEach(n => n.classList.remove('selected-node'));
                        node.classList.add('selected-node');
                        const text = node.textContent.trim().replace(/\s+/g, ' ');
                        toast.textContent = '✦  ' + text;
                        toast.classList.add('show-toast');
                        clearTimeout(toastTimeout);
                        toastTimeout = setTimeout(() => toast.classList.remove('show-toast'), 3500);
                        e.stopPropagation();
                    });
                });

                svgEl.addEventListener('click', () => {
                    nodes.forEach(n => n.classList.remove('selected-node'));
                    toast.classList.remove('show-toast');
                });

            } catch (err) {
                console.error(err);
                const errorDiv = document.getElementById('error-log');
                errorDiv.style.display = 'block';
                errorDiv.textContent = 'MERMAID RENDER ERROR:\n' + err;
            }
        }

        drawDiagram();
    </script>
</body>
</html>
